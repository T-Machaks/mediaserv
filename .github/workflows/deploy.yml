name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Run deploy.sh on instance via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09e9fd27536228937" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ssm-user bash -lc \"cd /home/ssm-user/mediaserv && ./deploy.sh\""]' \
            --query "Command.CommandId" --output text)

          echo "SSM command id: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-09e9fd27536228937" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-09e9fd27536228937" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-09e9fd27536228937" \
            --query "Status" --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi

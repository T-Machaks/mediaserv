name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      - name: Run deploy.sh on instance via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09e9fd27536228937" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["sudo -u ec2-user bash -lc \"cd /home/ec2-user/mediaserv-website && git pull && bash deploy.sh\" && sudo fuser -k 3000/tcp || true && sleep 2 && sudo systemctl restart mediaserv-website && sleep 2 && sudo ss -ltnp | grep :3000"]' \
            --query "Command.CommandId" --output text)

          echo "SSM command id: $COMMAND_ID"

          STATUS="Pending"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-09e9fd27536228937" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] Status: $STATUS"
            case "$STATUS" in
              InProgress|Pending|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-09e9fd27536228937" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" \
            --output json

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed or timed out with status: $STATUS"
            exit 1
          fi
